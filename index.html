<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>היכל המשנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
/* Layout: one working column. Cycle banner on top, seder filter, grid of unit cards, sticky selection bar. Admin is a separate view behind a password. */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --ink:#1a2233; --muted:#59647a; --line:#d8dee9;
  --accent:#2b4a8c; --accent-ink:#ffffff; --accent-soft:#e4eaf7;
  --free:#16755a; --free-bg:#e0f1ea; --taken:#6d778a; --taken-bg:#e9edf3;
  --warn:#9a5b12; --warn-bg:#fbefd9; --danger:#a63232; --danger-bg:#f9e3e3;
  --display:"Frank Ruhl Libre","David Libre","Times New Roman",serif;
  --body:"Assistant","Segoe UI","Arial Hebrew",Arial,sans-serif;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141d; --surface:#171e2b; --ink:#e7ecf5; --muted:#98a4b8; --line:#2a3446;
    --accent:#8fb0ff; --accent-ink:#0d1626; --accent-soft:#1d2a47;
    --free:#6ccfa8; --free-bg:#14322a; --taken:#8591a6; --taken-bg:#1d2533;
    --warn:#e6b567; --warn-bg:#3a2d14; --danger:#f19a9a; --danger-bg:#3d1f1f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141d; --surface:#171e2b; --ink:#e7ecf5; --muted:#98a4b8; --line:#2a3446;
  --accent:#8fb0ff; --accent-ink:#0d1626; --accent-soft:#1d2a47;
  --free:#6ccfa8; --free-bg:#14322a; --taken:#8591a6; --taken-bg:#1d2533;
  --warn:#e6b567; --warn-bg:#3a2d14; --danger:#f19a9a; --danger-bg:#3d1f1f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl;padding-inline:16px;padding-block:20px 0}
.wrap{max-width:1100px;margin-inline:auto}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.15}
h2{font-size:1.4rem}
h3{font-size:1.15rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 auto;min-width:0}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:34px;padding:4px 12px;font-size:.9rem}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px;font-weight:600}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;padding-bottom:16px}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.cycle{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.cycle .k{font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.cycle .v{font-size:1.05rem;font-weight:700}
.closed{background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:12px 14px;margin-top:12px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-block:20px 10px;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;min-height:38px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.count{margin-inline-start:auto;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:110px}
.card{position:relative;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card[data-state="free"]{cursor:pointer}
.card[data-state="free"]:hover{border-color:var(--accent)}
.card[data-state="taken"]{background:var(--taken-bg);color:var(--taken)}
.card[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.card[data-locked="true"]{opacity:.55;cursor:not-allowed}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.code{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:.9rem;letter-spacing:.04em}
.chip{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:999px}
.chip.free{background:var(--free-bg);color:var(--free)}
.chip.taken{background:var(--taken-bg);color:var(--taken);border:1px solid var(--line)}
.chip.mine{background:var(--accent);color:var(--accent-ink)}
.card .title{font-family:var(--display);font-size:1.18rem;font-weight:700;line-height:1.3;color:inherit;overflow-wrap:anywhere}
.card .meta{font-size:.88rem;color:var(--muted)}
.card .dbl{font-size:.82rem;background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:3px 8px;align-self:flex-start;font-weight:600}
.bar{position:sticky;bottom:0;margin-inline:-16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(20,30,50,.08);z-index:5}
.bar .inner{max-width:1100px;margin-inline:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.form{display:grid;gap:14px;max-width:520px}
.field{display:grid;gap:4px}
.field label,.legend{font-weight:700;font-size:.95rem}
.field input,.field select{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.field .err{color:var(--danger);font-size:.88rem;min-height:1.1em}
.radios{display:grid;gap:8px}
.radios label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.radios input{margin-top:4px;accent-color:var(--accent)}
.sel-list{display:grid;gap:8px;margin-block:8px}
.sel-item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:8px 12px}
.sched{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-block:10px}
.sched-h{background:var(--accent-soft);padding:8px 12px;font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sched ol{list-style:none;margin:0;padding:0}
.sched li{display:flex;gap:12px;padding:7px 12px;border-top:1px solid var(--line)}
.sched li .wk{width:4.6rem;color:var(--muted);flex:none}
.sched li .dt{margin-inline-start:auto;color:var(--muted);font-size:.9rem}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-block:16px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:10px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:700;background:var(--bg)}
tr:last-child td{border-bottom:0}
.tag{display:inline-flex;gap:4px;align-items:center;background:var(--accent-soft);border-radius:8px;padding:2px 4px 2px 8px;margin:2px;font-size:.9rem}
.tag button{border:0;background:none;color:var(--danger);font-weight:700;padding:0 6px;min-height:24px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-block:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.6rem;font-family:var(--display);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.9rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(90px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;text-align:center;font-weight:600;z-index:20}
footer{margin-block:24px;padding-bottom:24px;color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:.92rem}
textarea.csv{width:100%;min-height:120px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px;font-family:monospace;direction:ltr}
@media (prefers-reduced-motion: no-preference){.card{transition:border-color .12s,background .12s}}
@media (max-width:520px){.count{margin-inline-start:0;width:100%}}
.brand{background:none;border:0;padding:0;font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.15;color:var(--ink)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px;color:var(--muted);font-size:.95rem}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.tile{text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:130px}
.tile:hover{border-color:var(--accent)}
.tile h3{color:var(--accent)}
.tile .sub{color:var(--muted);font-size:.93rem}
.tile .live{margin-top:auto;font-weight:700;font-size:.88rem;color:var(--free)}
.big{font-family:var(--display);font-size:1.5rem;font-weight:700}
.msg{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:8px}
.msg img{max-width:100%;border-radius:10px}
.msg .when{color:var(--muted);font-size:.85rem}
.explain{background:var(--accent-soft);border-radius:12px;padding:14px 16px;display:grid;gap:6px}
.explain p{margin:0}
.me{background:var(--accent-soft)!important}
.ok{color:var(--free);font-weight:700}
.st{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--taken-bg);color:var(--taken)}
.st.open{background:var(--free-bg);color:var(--free)}
.st.learning{background:var(--accent-soft);color:var(--accent)}
.stack{display:grid;gap:14px}
.winner{font-weight:700;font-size:1.05rem}
.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:8px}
.card{padding:9px 10px;gap:4px;border-radius:10px}
.card .title{font-size:.98rem}
.card .meta{font-size:.8rem}
.overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;padding:20px;max-width:440px;width:100%;display:grid;gap:12px;box-shadow:var(--shadow)}
.dedic{text-align:center;color:var(--danger);font-weight:700;margin:0 0 12px}
.wt table{min-width:0}
.wt th,.wt td{text-align:center;white-space:nowrap;padding:8px 10px}
.wt th:first-child,.wt td:first-child{position:sticky;inset-inline-start:0;background:var(--surface);text-align:start;white-space:normal;min-width:130px;z-index:1;border-inline-end:1px solid var(--line)}
.wt th:first-child{background:var(--bg)}
.wt .cur{background:var(--accent-soft)}
.wt th.cur{background:var(--accent);color:var(--accent-ink)}
.wt tr.me td{background:var(--accent-soft)}
.wt .wd{font-size:.75rem;font-weight:400}
.wt .now{font-size:.75rem;font-weight:700}
html[data-kiosk] .hub{grid-template-columns:1fr}
html[data-kiosk] .tile{min-height:92px;padding:18px}
html[data-kiosk] .tile h3{font-size:1.5rem}
html[data-kiosk] .btn{min-height:56px;font-size:1.1rem}
html[data-kiosk] .field input,html[data-kiosk] .field select{min-height:56px;font-size:1.1rem}
html[data-kiosk] .grid{grid-template-columns:repeat(2,1fr)}
html[data-kiosk] .pill{min-height:48px}
html[data-kiosk] header.top{justify-content:center;text-align:center}
html[data-kiosk] .crumbs{font-size:1.05rem}
html[data-kiosk] footer{justify-content:center}
[hidden]{display:none!important}
.kb{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px;z-index:40;box-shadow:0 -4px 18px rgba(20,30,50,.18)}
.kbrow{display:flex;gap:5px;justify-content:center;margin-bottom:5px}
.kbk{flex:1 1 0;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1.15rem;font-weight:700;padding:0;color:var(--ink)}
.kbk.wide{flex:1.6 1 0}.kbk.space{flex:3 1 0}
.kbk.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kbk.dom{font-size:.8rem;font-weight:600;direction:ltr}
</style>

</head>
